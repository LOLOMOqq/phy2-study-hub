  <text x="300" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#2f9e44" font-family="Arial">Net = vector sum</text>

  <text x="380" y="255" text-anchor="middle" font-size="16" font-family="Arial" fill="#444">Direction matters: draw arrows, break into components if needed, then add.</text>
