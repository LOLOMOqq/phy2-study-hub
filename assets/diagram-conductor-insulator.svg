<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260">
  <rect width="100%" height="100%" rx="18" fill="#fbfcff"/>
  <text x="350" y="34" text-anchor="middle" font-size="26" font-family="Arial" font-weight="700" fill="#24324a">Conductors vs Insulators</text>
  <rect x="30" y="60" width="300" height="170" rx="14" fill="#eefbf3" stroke="#63e6be"/>
  <text x="180" y="88" text-anchor="middle" font-size="20" font-family="Arial" font-weight="700" fill="#0b7285">Conductor</text>
  <text x="180" y="110" text-anchor="middle" font-size="14" font-family="Arial" fill="#355">Free electrons can move</text>
  <g fill="#74c0fc" stroke="#1c7ed6">
    <circle cx="80" cy="150" r="10"/><circle cx="120" cy="170" r="10"/><circle cx="160" cy="140" r="10"/><circle cx="200" cy="175" r="10"/><circle cx="240" cy="145" r="10"/><circle cx="280" cy="170" r="10"/>
  </g>
  <path d="M70 150 h40 M110 170 h40 M150 140 h40 M190 175 h40 M230 145 h40" stroke="#1c7ed6" stroke-width="3" stroke-linecap="round"/>
  <text x="180" y="215" text-anchor="middle" font-size="14" font-family="Arial" fill="#355">Charge spreads over surface</text>

  <rect x="370" y="60" width="300" height="170" rx="14" fill="#fff4e6" stroke="#ffc078"/>
  <text x="520" y="88" text-anchor="middle" font-size="20" font-family="Arial" font-weight="700" fill="#d9480f">Insulator</text>
  <text x="520" y="110" text-anchor="middle" font-size="14" font-family="Arial" fill="#653">Electrons are bound</text>
  <g fill="#74c0fc" stroke="#1c7ed6">
    <circle cx="420" cy="150" r="10"/><circle cx="470" cy="150" r="10"/><circle cx="520" cy="150" r="10"/><circle cx="570" cy="150" r="10"/><circle cx="620" cy="150" r="10"/>
    <circle cx="445" cy="185" r="10"/><circle cx="545" cy="185" r="10"/>
  </g>
  <g stroke="#868e96" stroke-width="2">
    <line x1="410" y1="140" x2="430" y2="160"/><line x1="430" y1="140" x2="410" y2="160"/>
    <line x1="460" y1="140" x2="480" y2="160"/><line x1="480" y1="140" x2="460" y2="160"/>
    <line x1="510" y1="140" x2="530" y2="160"/><line x1="530" y1="140" x2="510" y2="160"/>
    <line x1="560" y1="140" x2="580" y2="160"/><line x1="580" y1="140" x2="560" y2="160"/>
    <line x1="610" y1="140" x2="630" y2="160"/><line x1="630" y1="140" x2="610" y2="160"/>
  </g>
  <text x="520" y="215" text-anchor="middle" font-size="14" font-family="Arial" fill="#653">Charge stays mostly in place</text>
</svg>
