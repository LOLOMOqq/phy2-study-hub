<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L10,3 z" fill="#e03131"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L10,3 z" fill="#1971c2"/></marker>
  </defs>
  <rect width="100%" height="100%" rx="18" fill="#fbfcff"/>
  <text x="380" y="34" text-anchor="middle" font-size="26" font-family="Arial" font-weight="700" fill="#24324a">Coulomb’s Law: Force Between Charges</text>
  <g transform="translate(0,10)">
    <circle cx="150" cy="120" r="34" fill="#ff8787" stroke="#c92a2a"/>
    <text x="150" y="128" text-anchor="middle" font-size="24" fill="#fff" font-family="Arial">+</text>
    <text x="150" y="170" text-anchor="middle" font-size="16" font-family="Arial">q₁</text>
    <circle cx="330" cy="120" r="34" fill="#74c0fc" stroke="#1864ab"/>
    <text x="330" y="128" text-anchor="middle" font-size="24" fill="#fff" font-family="Arial">−</text>
    <text x="330" y="170" text-anchor="middle" font-size="16" font-family="Arial">q₂</text>
    <line x1="184" y1="120" x2="230" y2="120" stroke="#e03131" stroke-width="5" marker-end="url(#ar)"/>
    <line x1="296" y1="120" x2="250" y2="120" stroke="#1971c2" stroke-width="5" marker-end="url(#ab)"/>
    <text x="240" y="95" text-anchor="middle" font-size="16" font-family="Arial" fill="#2b8a3e">attractive</text>
    <line x1="150" y1="200" x2="330" y2="200" stroke="#555" stroke-width="2"/>
    <line x1="150" y1="192" x2="150" y2="208" stroke="#555" stroke-width="2"/>
    <line x1="330" y1="192" x2="330" y2="208" stroke="#555" stroke-width="2"/>
    <text x="240" y="222" text-anchor="middle" font-size="16" font-family="Arial">distance r</text>
  </g>
  <g transform="translate(380,10)">
    <circle cx="120" cy="120" r="34" fill="#ff8787" stroke="#c92a2a"/>
    <text x="120" y="128" text-anchor="middle" font-size="24" fill="#fff" font-family="Arial">+</text>
    <circle cx="300" cy="120" r="34" fill="#ff8787" stroke="#c92a2a"/>
    <text x="300" y="128" text-anchor="middle" font-size="24" fill="#fff" font-family="Arial">+</text>
    <line x1="86" y1="120" x2="35" y2="120" stroke="#e03131" stroke-width="5" marker-end="url(#ar)"/>
    <line x1="334" y1="120" x2="385" y2="120" stroke="#e03131" stroke-width="5" marker-end="url(#ar)"/>
    <text x="210" y="95" text-anchor="middle" font-size="16" font-family="Arial" fill="#e03131">repulsive</text>
  </g>
  <text x="380" y="255" text-anchor="middle" font-size="20" font-family="Arial" fill="#24324a">F = k|q₁q₂|/r²  (bigger charges → bigger F, bigger distance → much smaller F)</text>
</svg>
